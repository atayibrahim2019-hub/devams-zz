name: DevamsızlıkKOU APK Derleyici (Cloud Build)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK Oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter SDK Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android Platform Dosyalarını Eksiksiz Yeniden Oluştur
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.kou --project-name devamsizlik_kou

      - name: Bağımlılıkları Yükle
        run: flutter pub get

      - name: APK Derle (Release)
        run: flutter build apk --release

      - name: APK Dosyasını İndirilebilir Olarak Yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: DevamsizlikKOU-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
